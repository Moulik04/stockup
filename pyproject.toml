[project]
name = "reorderpoint"
version = "0.1.0"
description = "Demand forecasting to reorder decisions, with backtesting, deployment, and monitoring."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "kaggle>=1.6",
    "statsforecast>=1.7",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "hierarchicalforecast>=1.5.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "streamlit>=1.63.0",
    "joblib>=1.6.0",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "httpx>=0.28.1",
]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is Depends(...) as an argument default — not the mutable-
# default-argument bug B008 exists to catch.
"reorderpoint/serve.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "notebooks/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reorderpoint"]
